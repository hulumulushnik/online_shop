<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій магазин{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        header { background: #2c3e50; color: white; padding: 15px 30px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; }
        .price { color: #27ae60; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <header>
        <h1>{% block header %}Мій магазин{% endblock %}</h1>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
